[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-sysid"
version = "0.1.0"
description = "Physically-consistent inertial parameter identification, Go2 port"
requires-python = ">=3.11, <3.12"
dependencies = [
      "pin==3.9.0",           # PyPI name for pinocchio; unpinned resolves to 4.1.0 -- see KB §1
      "cmeel-urdfdom==4.0.1", # pin==3.9.0's binary is linked against urdfdom's 4.0.x soname; unpinned resolves to 6.0.0, an ABI mismatch (missing liburdfdom_sensor.4.0.dylib)
      "cmeel-tinyxml2==10.0.0", # urdfdom==4.0.1 is linked against tinyxml2's soname 10; unpinned resolves to 11.0.0, missing libtinyxml2.10.dylib
      "cvxpy==1.9.2",
      "casadi==3.7.2",
      "mujoco==3.10.0",
      "numpy>=2.3,<2.4",       # pin==3.9.0's PyPI wheel pulls in cmeel-boost, which caps numpy at <2.4
      "scipy",
      "matplotlib",
      "pyyaml",
      "urdf-parser-py",       # missing from the authors' env; rigid_body_dynamics.py needs it at import
      "trimesh",               # missing from the authors' env; rigid_body_dynamics.py needs it at import
  ]

[project.optional-dependencies]
  mosek = ["mosek==11.2.2"]  # license-gated; CLARABEL (ships with cvxpy) is the license-free default
  dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "utils*"]
namespaces = true